[project]
name = "assertify-mcp"
version = "0.4.0"
description = "Let AI agents use any website you're logged in to. Log in once; the session stays encrypted on your machine."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Roman Klym" }]
requires-python = ">=3.10"
keywords = ["mcp", "model-context-protocol", "playwright", "browser-automation", "ai-agents", "claude", "codex"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "mcp>=2.0",
    "playwright>=1.51",
    "cryptography>=42",
    "keyring>=25",
]

[project.urls]
Homepage = "https://github.com/romaklym/assertify"
Issues = "https://github.com/romaklym/assertify/issues"

[project.scripts]
assertify = "assertify.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assertify"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
