name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run playwright install --with-deps chromium
      - name: Tests
        shell: bash
        # Login tests open a visible window; Linux runners have no screen, so give them a virtual one
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a uv run pytest -v; else uv run pytest -v; fi
