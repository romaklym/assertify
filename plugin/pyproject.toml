# Records the exact Assertify release and its dependencies (versions and hashes) for the plugin directory.
# .mcp.json starts that same version with `uvx assertify-mcp==0.6.3`.
[project]
name = "assertify-plugin"
version = "0.6.3"
requires-python = ">=3.12"
dependencies = ["assertify-mcp==0.6.3"]

[tool.uv]
package = false
